    <form id="formulario">
        <label for="izena">Izena:</label>
        <input type="text" name="izena" required>
        <br>

        <br>

        <label for="arazoa">Zure arazoa azaldu:</label>

                  required></textarea>
        <br>

        <label for="telefonoa">Telefono zenbakia:</label>
        <input type="tel" name="telefonoa"
               title="Introduce solamente números" required>
        <br>

        <label for="posta">e-posta:</label>

        <br>
        <button type="submit">Bidali</button>
    </form>
